[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "extract-bench"
version = "0.1.0"
description = "Typed field extraction from real documents: 12 public datasets, one scorer, per-field accuracy including 'not in the document'."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Levanto Labs" }]
keywords = ["benchmark", "document-extraction", "information-extraction", "evaluation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "tiktoken>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]
analysis = ["rapidfuzz>=3"]

[project.scripts]
extract-bench = "extract_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
